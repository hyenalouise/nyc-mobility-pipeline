# Databricks Asset Bundle for the NYC Mobility pipeline.
#
# This file is the source of truth for the job. Change the job by changing this
# file and deploying, not by editing it in the workspace: a UI edit does not
# reach the file, and the next deploy overwrites it.
bundle:
  name: nyc-mobility-pipeline

variables:
  # One SQL warehouse runs every task. The id was written out 30 times, so a
  # workspace whose warehouse differs needed 30 edits. Warehouse ids are per
  # workspace: confirm with `databricks warehouses list` whenever the target
  # host changes, rather than carrying an id over.
  #
  # Override without editing this file:
  #   databricks bundle deploy --target dev --var="warehouse_id=<id>"
  warehouse_id:
    description: SQL warehouse that every task runs on.
    default: bd9af8d40007e504

targets:
  # Each target names its workspace host explicitly. Left to the CLI profile,
  # a deploy lands wherever the operator happens to be authenticated, which is
  # a silent way to deploy into the wrong workspace.
  #
  # development mode deploys as a SEPARATE job, "[dev <user>] NYC Mobility
  # Pipeline", and pauses any schedule -- so a first deploy cannot land on top
  # of a job someone is relying on.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-cd77c839-62eb.cloud.databricks.com

    resources:
      jobs:
        NYC_Mobility_Pipeline:
          email_notifications:
            on_failure:
              - ${workspace.current_user.userName}

  # Deploys under the real job name with no prefix. Only after a dev deploy
  # has been verified.
  #
  # root_path is required in production mode, and is one fixed folder rather
  # than one per person on purpose: the bundle's deployment state lives there,
  # so a per-user path would let a second person's prod deploy create a
  # duplicate job instead of updating the one that exists. Validate warns that
  # /Workspace/Shared is writable by every workspace user; that is accepted
  # here so any of us can redeploy, and is the thing to narrow if this ever
  # outlives the course.
  prod:
    mode: production
    workspace:
      host: https://dbc-cd77c839-62eb.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    resources:
      jobs:
        NYC_Mobility_Pipeline:
          email_notifications:
            on_failure:
              - briana.capul@ftwfoundation.org
              - hazelle.cuevas@ftwfoundation.org
              - crystal.manas@ftwfoundation.org
              - gabrielle.torres@ftwfoundation.org
              - ina.magno@ftwfoundation.org

resources:
  dashboards:
    data_quality_dashboard:
      display_name: NYC Mobility Data Quality Dashboard
      file_path: dashboards/11_data_quality_dashboard/10_NYC_mobility_data_quality_dashboard.lvdash.json
      warehouse_id: ${var.warehouse_id}
    analytics_dashboard:
      display_name: NYC Mobility Analytics Dashboard
      file_path: dashboards/11_analytics_dashboard/10_NYC_mobility_analytics_dashboard.lvdash.json
      warehouse_id: ${var.warehouse_id}
    pipeline_execution_dashboard:
      display_name: NYC Mobility Pipeline Execution Dashboard
      file_path: dashboards/11_pipeline_execution_monitoring/10_NYC_mobility_pipeline_execution_dashboard.lvdash.json
      warehouse_id: ${var.warehouse_id}
  jobs:
    NYC_Mobility_Pipeline:
      name: NYC Mobility Pipeline
      tasks:
        - task_key: 00_create_control_tables
          sql_task:
            file:
              path: etl/01_control/00_create_control_tables.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        # Pre-ingestion source gates (#148). Each runs the DuckDB gate on its
        # source's files in the Volume before that source's Bronze loader,
        # and records one row per check in data_quality_results. A BLOCKED
        # delivery fails the task, so only that source's loader and what
        # follows it are skipped; the other sources carry on (D17).
        - task_key: 05_source_gate_green_taxi
          depends_on:
            - task_key: 00_create_control_tables
          environment_key: source_gate
          spark_python_task:
            python_file: src/ingestion/source_gate.py
            source: GIT
            parameters:
              - --source
              - green_taxi
              - --input
              - "{{job.parameters.green_taxi_input}}"
              - --load-input
              - /Volumes/ftw-week-08/00-source/group_a_source/green_taxi/*.parquet
              - --evidence
              - /tmp/source_gate_green_taxi.json
              - --record-control
              - --code-revision
              - "{{job.parameters.code_revision}}"
        - task_key: 05_source_gate_taxi_zones
          depends_on:
            - task_key: 00_create_control_tables
          environment_key: source_gate
          spark_python_task:
            python_file: src/ingestion/source_gate.py
            source: GIT
            parameters:
              - --source
              - taxi_zones
              - --input
              - "{{job.parameters.taxi_zones_input}}"
              - --load-input
              - /Volumes/ftw-week-08/00-source/group_a_source/taxi_zones/taxi_zone_lookup.csv
              - --evidence
              - /tmp/source_gate_taxi_zones.json
              - --record-control
              - --code-revision
              - "{{job.parameters.code_revision}}"
        # Weather's gate (#125) reads the same landed response the Bronze
        # loader reads (20_load_open_meteo.sql), not a local copy.
        - task_key: 05_source_gate_weather
          depends_on:
            - task_key: 00_create_control_tables
          environment_key: source_gate
          spark_python_task:
            python_file: src/ingestion/source_gate.py
            source: GIT
            parameters:
              - --source
              - weather
              - --input
              - "{{job.parameters.weather_input}}"
              - --load-input
              - /Volumes/ftw-week-08/00-source/group_a_source/weather/open_meteo_mar_may_2026.json
              - --evidence
              - /tmp/source_gate_weather.json
              - --record-control
              - --code-revision
              - "{{job.parameters.code_revision}}"
        - task_key: 10_load_green_taxi
          depends_on:
            - task_key: 05_source_gate_green_taxi
          sql_task:
            file:
              path: etl/02_bronze/10_load_green_taxi.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 20_load_open_meteo
          depends_on:
            - task_key: 05_source_gate_weather
          sql_task:
            file:
              path: etl/02_bronze/20_load_open_meteo.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 30_load_taxi_zones
          depends_on:
            - task_key: 05_source_gate_taxi_zones
          sql_task:
            file:
              path: etl/02_bronze/30_load_taxi_zones.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 90_validate_control
          depends_on:
            - task_key: 10_load_green_taxi
            - task_key: 20_load_open_meteo
            - task_key: 30_load_taxi_zones
          sql_task:
            file:
              path: etl/01_control/90_validate_control.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 90_validate_green_taxi
          depends_on:
            - task_key: 10_load_green_taxi
          sql_task:
            file:
              path: etl/02_bronze/90_validate_green_taxi.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 90_validate_open_meteo
          depends_on:
            - task_key: 20_load_open_meteo
          sql_task:
            file:
              path: etl/02_bronze/90_validate_open_meteo_weather.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 90_validate_taxi_zones
          depends_on:
            - task_key: 30_load_taxi_zones
          sql_task:
            file:
              path: etl/02_bronze/90_validate_taxi_zones.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 10_clean_green_taxi
          depends_on:
            - task_key: 90_validate_green_taxi
          sql_task:
            file:
              path: etl/03_silver/10_clean_green_taxi.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 90_validate_clean_green_taxi
          depends_on:
            - task_key: 10_clean_green_taxi
          sql_task:
            file:
              path: etl/03_silver/90_validate_green_taxi.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 20_clean_weather_hourly
          depends_on:
            - task_key: 90_validate_open_meteo
          sql_task:
            file:
              path: etl/03_silver/20_clean_weather_hourly.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 90_validate_clean_weather_hourly
          depends_on:
            - task_key: 20_clean_weather_hourly
          sql_task:
            file:
              path: etl/03_silver/90_validate_weather_hourly.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 30_clean_taxi_zones
          depends_on:
            - task_key: 90_validate_taxi_zones
          sql_task:
            file:
              path: etl/03_silver/30_clean_taxi_zones.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 90_validate_clean_taxi_zones
          depends_on:
            - task_key: 30_clean_taxi_zones
          sql_task:
            file:
              path: etl/03_silver/90_validate_taxi_zones.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 10_resolve_trip_zones
          depends_on:
            - task_key: 90_validate_clean_green_taxi
            - task_key: 90_validate_clean_taxi_zones
            - task_key: 90_validate_clean_weather_hourly
            - task_key: 90_validate_control
          sql_task:
            file:
              path: etl/04_integration/10_resolve_trip_zones.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 20_resolve_trip_weather
          depends_on:
            - task_key: 10_resolve_trip_zones
          sql_task:
            file:
              path: etl/04_integration/20_resolve_trip_weather.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 90_validate_integration
          depends_on:
            - task_key: 20_resolve_trip_weather
          sql_task:
            file:
              path: etl/04_integration/90_validate_integration.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 10_dim_date
          depends_on:
            - task_key: 90_validate_integration
          sql_task:
            file:
              path: etl/05_gold/10_dim_date.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 11_dim_hour
          depends_on:
            - task_key: 90_validate_integration
          sql_task:
            file:
              path: etl/05_gold/11_dim_hour.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 12_dim_taxi_zone
          depends_on:
            - task_key: 90_validate_integration
          sql_task:
            file:
              path: etl/05_gold/12_dim_taxi_zone.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 13_dim_weather_classification
          depends_on:
            - task_key: 90_validate_integration
          sql_task:
            file:
              path: etl/05_gold/13_dim_weather_classification.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 20_fact_weather_hourly
          depends_on:
            - task_key: 10_dim_date
            - task_key: 11_dim_hour
            - task_key: 12_dim_taxi_zone
            - task_key: 13_dim_weather_classification
          sql_task:
            file:
              path: etl/05_gold/20_fact_weather_hourly.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 30_fact_taxi_trip
          depends_on:
            - task_key: 20_fact_weather_hourly
          sql_task:
            file:
              path: etl/05_gold/30_fact_taxi_trip.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 90_validate_gold
          depends_on:
            - task_key: 20_fact_weather_hourly
            - task_key: 30_fact_taxi_trip
          sql_task:
            file:
              path: etl/05_gold/90_validate_gold.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 10_activity_by_time_and_zone
          depends_on:
            - task_key: 90_validate_gold
          sql_task:
            file:
              path: etl/06_analytics/10_activity_by_time_and_zone.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 20_trip_behavior_by_weather
          depends_on:
            - task_key: 90_validate_gold
          sql_task:
            file:
              path: etl/06_analytics/20_trip_behavior_by_weather.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 30_mobility_patterns_by_zone
          depends_on:
            - task_key: 90_validate_gold
          sql_task:
            file:
              path: etl/06_analytics/30_mobility_patterns_by_zone.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: 90_validate_analytics
          depends_on:
            - task_key: 10_activity_by_time_and_zone
            - task_key: 20_trip_behavior_by_weather
            - task_key: 30_mobility_patterns_by_zone
          sql_task:
            file:
              path: etl/06_analytics/90_validate_analytics.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}
        - task_key: dq_dashboard
          depends_on:
            - task_key: 90_validate_gold
            - task_key: 90_validate_analytics
            - task_key: 90_validate_clean_green_taxi
            - task_key: 90_validate_open_meteo
            - task_key: 90_validate_green_taxi
            - task_key: 90_validate_clean_weather_hourly
            - task_key: 90_validate_integration
            - task_key: 90_validate_taxi_zones
            - task_key: 90_validate_control
            - task_key: 90_validate_clean_taxi_zones
            - task_key: 05_source_gate_green_taxi
            - task_key: 05_source_gate_taxi_zones
            - task_key: 05_source_gate_weather
          run_if: ALL_DONE
          dashboard_task:
            subscription: {}
            warehouse_id: ${var.warehouse_id}
            dashboard_id: ${resources.dashboards.data_quality_dashboard.id}
        - task_key: nyc_mobility_analytics
          depends_on:
            - task_key: 90_validate_analytics
          dashboard_task:
            subscription: {}
            warehouse_id: ${var.warehouse_id}
            dashboard_id: ${resources.dashboards.analytics_dashboard.id}
        - task_key: pipeline_execution_monitoring
          depends_on:
            - task_key: 90_validate_control
          run_if: ALL_DONE
          dashboard_task:
            subscription: {}
            warehouse_id: ${var.warehouse_id}
            dashboard_id: ${resources.dashboards.pipeline_execution_dashboard.id}
      # Serverless job compute for the three Python source gates. The SQL
      # warehouse runs SQL only. duckdb is pinned to the version in
      # requirements-dev.txt, so the job runs the same engine as CI and the
      # committed evidence; tests/test_bundle_contract.py fails if they drift.
      environments:
        - environment_key: source_gate
          spec:
            environment_version: "5"
            dependencies:
              - duckdb==1.1.3

      # Every gate reads :code_revision and stamps it on the rows it writes, so
      # a data-quality result can be traced to the code that produced it.
      #
      # Declared once at job level: a job parameter reaches a sql_task without
      # per-task wiring, so ten per-task entries would be ten things to get
      # wrong. Resolved at deploy time from the same substitution as
      # git_source below, so the commit that runs and the commit recorded are
      # the same value by construction.
      #
      # Override for a backfill that reproduces an older revision:
      #   databricks bundle run NYC_Mobility_Pipeline --params code_revision=<sha>
      parameters:
        - name: code_revision
          default: ${bundle.git.commit}

        # What each source gate reads (#158). The defaults are the landing
        # paths the Bronze loaders read, so a normal or scheduled run checks
        # exactly what gets loaded. Override one to make a gate refuse a test
        # delivery staged outside the landing folder:
        #   databricks bundle run NYC_Mobility_Pipeline \
        #     --params 'green_taxi_input=/Volumes/.../_test/green_taxi_blocked/*.parquet'
        # The loaders always read the landing folder, so test data is never
        # loaded. Each gate is also given its loader's path (--load-input):
        # when its input differs, the gate records its results and then fails
        # even if the test input passed, so an override run never loads
        # landing files it didn't check (#159).
        - name: green_taxi_input
          default: /Volumes/ftw-week-08/00-source/group_a_source/green_taxi/*.parquet
        - name: taxi_zones_input
          default: /Volumes/ftw-week-08/00-source/group_a_source/taxi_zones/taxi_zone_lookup.csv
        - name: weather_input
          default: /Volumes/ftw-week-08/00-source/group_a_source/weather/open_meteo_mar_may_2026.json

      # Pinned to a commit, not a branch, and deliberately.
      #
      # A branch is resolved when the job RUNS; ${bundle.git.commit} is
      # resolved when the bundle is DEPLOYED. With git_branch, deploying at
      # commit A and then merging commit B means the job runs B's code while
      # recording A as its code_revision -- a traceability column that lies,
      # which is worse than one left empty.
      #
      # Pinning both to the same substitution makes the code that runs and the
      # revision recorded the same thing by construction. Picking up new code
      # then requires a deploy, which is the point of controlled deployment
      # rather than a limitation of it.
      git_source:
        git_url: https://github.com/hyenalouise/nyc-mobility-pipeline
        git_provider: gitHub
        git_commit: ${bundle.git.commit}
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED

      notification_settings:
        no_alert_for_canceled_runs: true

      # Weekly, Friday 11:30 New York time (D27, amended: Friday 23:30 Manila
      # while New York is on EDT, 00:30 Saturday on EST). The source is monthly, so a
      # daily run would find nothing new on almost every day; weekly bounds
      # how long a newly landed file waits to one week, and gives freshness
      # monitoring an interval to measure against.
      #
      # Quartz syntax, not crontab: seconds first, and `?` in the day-of-month
      # position because day-of-week is set. "30 11 * * 5" would not mean the
      # same thing here.
      #
      # No pause_status here, deliberately. Left unset, the target decides:
      # dev (development mode) deploys it PAUSED so nobody's sandbox fires
      # a timer, and prod deploys it UNPAUSED. Setting it on the job would
      # override that for every target.
      schedule:
        quartz_cron_expression: "0 30 11 ? * FRI"
        timezone_id: America/New_York
